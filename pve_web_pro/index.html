<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PVE 电源面板</title>
    <link rel="icon" sizes="128x128" href="/images/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* border: solid 1px black; */
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            display: flex;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.051);
            padding: 40px;
            text-align: center;
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .btnzone {
            flex: 7;
        }

        .setzone {
            flex: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.814);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            background: rgba(50, 50, 50, 0.814);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .server-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            border: 2px dashed #dee2e6;
        }

        .mac-address {
            font-family: monospace;
            font-size: 1.2rem;
            color: #4361ee;
            margin-bottom: 15px;
        }

        .server-address {
            font-family: monospace;
            font-size: 1.1rem;
            color: #4361ee;
            margin-bottom: 15px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .status-online {
            background-color: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-offline {
            background-color: #f44336;
        }

        .status-checking {
            background-color: #ff9800;
            animation: pulse 1s infinite;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center
        }

        .btn {
            padding: 18px 30px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
            min-width: 180px;
            transition: all 0.3s;
            position: relative;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-wake {
            background: linear-gradient(135deg, #4caf50, #2ecc71);
        }

        .btn-shutdown {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
        }

        .btn-switch-win {
            background: linear-gradient(135deg, #2196f3, #1976d2);
        }

        .btn.disabled,
        .btn.btn-disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .message {
            margin: 20px 0;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border-left: 4px solid #4caf50;
            display: block;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            border-left: 4px solid #f44336;
            display: block;
        }

        .footer {
            color: #666;
            font-size: 0.9rem;
            margin-top: 30px;
        }

        /* 自定义弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .modal-content {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-cancel {
            background: #f5f5f5;
            color: #666;
        }

        .modal-btn-cancel:hover {
            background: #e0e0e0;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #4361ee, #3a56d4);
            color: white;
        }

        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            cursor: wait;
            flex-shrink: 0;
        }

        .switch input {
            display: none;
            /* 隐藏原生checkbox */
        }

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ccc;
            border-radius: 34px;
            transition: 0.1s;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background: white;
            border-radius: 50%;
            transition: 0.1s;
        }


        .switch input:checked+.slider {
            background: #38c266;
        }

        .switch input:checked+.slider::before {
            transform: translateX(26px);
        }

        .buttons.wifimodel {
            margin: 20px 0;
        }

        .wifi {
            display: flex;
            gap: 10px;
            align-items: center;

        }

        .firewall-fieldset {
            display: flex;

        }

        .firewall-opzone {
            display: flex;
            flex-direction: column;
            flex: 6;
        }

        .firewall-open {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 4;
        }


        .firewall-option {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 50px;
        }

        .firebtn {
            cursor: pointer;
            width: 15px;
            accent-color: #38c266;
        }

        .firewalltext,
        .statustext,
        .wifi-label {
            font-size: 1rem;
            font-weight: 400;
        }

        .ser-status {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .status-s {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }

        .statustext {
            min-width: 120px;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 12px 0;
        }
        .hardStatus {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hard-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hard-text {
            font-size: 1rem;
            font-weight: 450;
            color: #666;
        }


        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
            }
        }

        @media (max-width: 650px) {
            .card {
                padding: 25px 20px;
                flex-direction: column;
            }

            h1 {
                font-size: 2rem;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .modal {
                padding: 20px;
            }

            .modal-buttons {
                flex-direction: column;
            }

        }

        @media (max-width: 900px) {
            .buttons.wifimodel {
                flex-direction: column;
                align-items: flex-start;
            }

            .firewall-fieldset {
                flex-direction: column;
            }

            .status-s {
                flex-direction: column;
                align-items: flex-start;
            }

            .statustext {
                margin: 8px 0 8px 50px;
            }
        }
    </style>
</head>

<body>
    <!-- 自定义弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">确认操作</div>
            </div>
            <div class="modal-content" id="modalContent">
                您确定要执行此操作吗？
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="modalCancel">
                    取消
                </button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirm">
                    确认
                </button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="btnzone">
            <h1>PVE 微控制器</h1>
            <p class="subtitle">远程管理您的 Proxmox VE 服务器</p>

            <div class="server-info">
                <div class="mac-address">MAC: xx:xx:xx:xx:xx:xx</div>
                <div class="server-address">服务器IP: x.x.x.x</div>
                <div class="status">
                    <div id="statusDot" class="status-dot status-checking"></div>
                    <span id="statusText">检测中...</span>
                </div>
                <div id="lastCheck" style="font-size: 0.9rem; color: #888; margin-top: 10px">
                    上次检测: --
                </div>
            </div>

            <div id="message" class="message"></div>

            <div class="buttons">
                <button id="wakeBtn" class="btn btn-wake">开机</button>
                <button id="shutdownBtn" class="btn btn-shutdown">关机</button>
            </div>

            <div class="buttons">
                <button id="switchWinBtn" class="btn btn-switch-win btn-disabled">
                    切换
                </button>
            </div>

            <div class="footer">
                <p>© 2026 PVE 控制面板 | 状态每30秒自动检测</p>
            </div>
        </div>
        <hr style="border: 1px solid #ccc; margin: 20px;" />
        <div class="setzone">

            <h2>ImmortalWRT快捷控制</h2>
            <div class="buttons wifimodel">
                <span style="font-size: 1.2rem; font-weight: 600; color: #333;">
                    无线发射模块：
                </span>
                <div class="wifi">
                    <span class="wifi-label" style="font-size: 1rem; font-weight: 500;">
                        2.4G信号
                    </span>
                    <label class="switch" id="Switch1">
                        <input type="checkbox" id="toggle1" disabled>
                        <span class="slider"></span>
                    </label>

                    <span class="wifi-label">
                        5G信号
                    </span>
                    <label class="switch" id="Switch2">
                        <input type="checkbox" id="toggle2" disabled>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <fieldset class="firewall-fieldset">
                <legend style="font-size: 1.2rem; font-weight: 600; color: #333; text-align: left; margin: 0 40px;">
                    防火墙策略：</legend>
                <div class="firewall-opzone">
                    <div class="firewall-option"
                        onclick="if(document.getElementById('fireDecide').checked){ const el = document.getElementById('0001'); el.checked = true; el.dispatchEvent(new Event('change', { bubbles: true })); }">
                        <input class="firebtn" type="radio" id="0001" name="firewall" disabled />
                        <label class="firewalltext" for="0001" style="margin: 0.4rem;">默认</label>
                    </div>

                    <div class="firewall-option"
                        onclick="if(document.getElementById('fireDecide').checked){ const el = document.getElementById('0002'); el.checked = true; el.dispatchEvent(new Event('change', { bubbles: true })); }">
                        <input class="firebtn" type="radio" id="0002" name="firewall" disabled />
                        <label class="firewalltext" for="0002" style="margin: 0.4rem;">全开放</label>
                    </div>

                    <div class="firewall-option"
                        onclick="if(document.getElementById('fireDecide').checked){ const el = document.getElementById('0003'); el.checked = true; el.dispatchEvent(new Event('change', { bubbles: true })); }">
                        <input class="firebtn" type="radio" id="0003" name="firewall" disabled />
                        <label class="firewalltext" for="0003" style="margin: 0.4rem;">全阻挡</label>
                    </div>
                    <div class="firewall-option">
                        <input style="width: 15px;" type="radio" id="other" name="firewall" disabled />
                        <label class="firewalltext" for="other" style="margin: 0.4rem; color: #666;">其它</label>
                    </div>
                </div>
                <hr style="border: 1px solid #ccc; margin: 10px;" />
                <div class="firewall-open">
                    <label class="switch" style="cursor: pointer;margin:0 0 10px 0;">
                        <input type="checkbox" id="fireDecide">
                        <span class="slider"></span>
                    </label>

                </div>
            </fieldset>
            <fieldset class="ser-status">
                <legend style="font-size: 1.2rem; font-weight: 600; color: #333; text-align: left; margin: 0 40px;">
                    服务状态：</legend>
                <div class="status-s">

                    <div class="statustext">
                        <div id="lucky" class="status-dot status-checking"></div><span>Lucky</span>
                    </div>
                    <div class="statustext">
                        <div id="aria2" class="status-dot status-checking"></div><span>Aria2</span>
                    </div>
                    <div class="statustext">
                        <div id="cloudflared" class="status-dot status-checking"></div><span>Cloudflared</span>
                    </div>
                </div>
                <div class="status-s">
                    <div class="statustext">
                        <div id="openlist2" class="status-dot status-checking"></div><span>Openlist2</span>
                    </div>
                    <div class="statustext">
                        <div id="passwall" class="status-dot status-checking"></div><span>Passwall</span>
                    </div>
                    <div class="statustext">
                        <div id="proxyover" class="status-dot status-checking"></div><span>透明代理</span>
                    </div>
                </div>
            </fieldset>
            <div class="hardStatus">
                <div class="hard-item">
                    <img src="/images/microchip-solid-full.svg" style="height: 25px;" alt="CPU" />
                    <span id="cpuText" class="hard-text">--</span>
                </div>
                <div class="hard-item">
                    <img src="/images/memory-solid-full.svg" style="height: 25px;" alt="内存" />
                    <span id="memText" class="hard-text">--</span>
                </div>
                <div class="hard-item">
                    <img src="/images/hard-drive-solid-full.svg" style="height: 25px;" alt="磁盘" />
                    <span id="diskText" class="hard-text">--</span>
                </div>
                <div class="hard-item">
                    <img src="/images/globe-solid-full.svg" style="height: 25px;" alt="网络" />
                    <span id="netText" class="hard-text">--</span>
                </div>
            </div>
            <hr style="border: 1px solid #cccccc9f; margin: 20px;" />
        </div>
    </div>


    <script>
        // 自定义弹窗系统
        class Modal {
            constructor() {
                this.overlay = document.getElementById("modalOverlay");
                this.title = document.getElementById("modalTitle");
                this.content = document.getElementById("modalContent");
                this.confirmBtn = document.getElementById("modalConfirm");
                this.cancelBtn = document.getElementById("modalCancel");

                this.promiseResolve = null;
                this.promiseReject = null;

                this.init();
            }

            init() {
                // 确认按钮点击事件
                this.confirmBtn.addEventListener("click", () => {
                    if (this.promiseResolve) {
                        this.promiseResolve(true);
                        this.promiseResolve = null;
                    }
                    this.hide();
                });

                // 取消按钮点击事件
                this.cancelBtn.addEventListener("click", () => {
                    if (this.promiseReject) {
                        this.promiseReject(false);
                        this.promiseReject = null;
                    }
                    this.hide();
                });

                // 点击遮罩层关闭
                this.overlay.addEventListener("click", (e) => {
                    if (e.target === this.overlay) {
                        if (this.promiseReject) {
                            this.promiseReject(false);
                            this.promiseReject = null;
                        }
                        this.hide();
                    }
                });
            }

            show(title, content) {
                this.title.textContent = title;
                this.content.textContent = content;
                this.overlay.classList.add("active");
                document.body.style.overflow = "hidden";

                // 焦点设置到确认按钮
                // setTimeout(() => {
                //     this.confirmBtn.focus();
                // }, 100);

                return new Promise((resolve, reject) => {
                    this.promiseResolve = resolve;
                    this.promiseReject = reject;
                });
            }

            hide() {
                this.overlay.classList.remove("active");
                document.body.style.overflow = "";
            }
        }

        // 初始化弹窗
        const modal = new Modal();

        // 服务器状态检测
        class ServerStatus {
            constructor() {
                this.statusDot = document.getElementById("statusDot");
                this.statusText = document.getElementById("statusText");
                this.lastCheck = document.getElementById("lastCheck");
                this.message = document.getElementById("message");
                this.checkInterval = 30000;
                this.init();
            }

            init() {
                this.checkStatus();
                setInterval(() => this.checkStatus(), this.checkInterval);
            }

            updateUI(mode, text) {
                const now = new Date().toLocaleTimeString("zh-CN");
                this.lastCheck.textContent = `上次检测: ${now}`;

                this.statusDot.className = "status-dot";
                if (mode === "checking") {
                    this.statusDot.classList.add("status-checking");
                    this.statusText.textContent = "检测中...";
                    document
                        .getElementById("switchWinBtn")
                        .classList.add("btn-disabled");
                } else if (mode === "online") {
                    this.statusDot.classList.add("status-online");
                    this.statusText.textContent = `在线 ${text}模式`;
                    document.getElementById("wakeBtn").classList.remove("pulse");
                    document
                        .getElementById("switchWinBtn")
                        .classList.remove("btn-disabled");
                } else if (mode === "offline") {
                    this.statusDot.classList.add("status-offline");
                    this.statusText.textContent = "离线";
                    document.getElementById("shutdownBtn").classList.remove("pulse");
                    document.getElementById("wakeBtn").classList.add("pulse");
                    document
                        .getElementById("switchWinBtn")
                        .classList.add("btn-disabled");
                }
            }

            async checkStatus() {
                this.updateUI("checking"); // 先显示检测中

                try {
                    const response = await fetch(
                        "/cgi-bin/ping_server.sh?" + Date.now(),
                    );

                    if (response.ok) {
                        const text = await response.text();

                        if (
                            text.includes("pveonline") ||
                            text.includes("1") ||
                            text.trim() === "pveonline"
                        ) {
                            this.updateUI("online", "PVE");
                        } else if (
                            text.includes("winonline") ||
                            text.includes("2") ||
                            text.trim() === "winonline"
                        ) {
                            this.updateUI("online", "WIN");
                        } else if (
                            text.includes("offline") ||
                            text.includes("0") ||
                            text.trim() === "offline"
                        ) {
                            this.updateUI("offline");
                        } else {
                            this.updateUI("offline");
                        }
                    } else {
                        this.updateUI("offline");
                    }
                } catch {
                    this.updateUI("offline"); // 网络错误也显示离线
                }
            }

            showMessage(text, isSuccess) {
                this.message.textContent = text;
                this.message.className = `message ${isSuccess ? "success" : "error"}`;
                this.message.style.display = "block";
                setTimeout(() => (this.message.style.display = "none"), 2400); // 2.4秒后隐藏
            }
        }

        // 初始化
        const server = new ServerStatus();

        // 按钮功能
        function setupButton(id, endpoint, confirmTitle, confirmMsg, successMsg) {
            const btn = document.getElementById(id);
            btn.addEventListener("click", async () => {
                if (btn.classList.contains("disabled")) return;

                // 使用自定义弹窗
                try {
                    const confirmed = await modal.show(confirmTitle, confirmMsg);
                    if (!confirmed) return;

                    // 禁用按钮
                    btn.classList.add("disabled");

                    // 执行操作（2.5秒超时）
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 2500);

                        const response = await fetch(endpoint, {
                            signal: controller.signal,
                        });
                        clearTimeout(timeoutId);

                        const text = await response.text();
                        if (text.includes("OKK")) {
                            server.showMessage(successMsg, true);
                            setTimeout(() => server.checkStatus(), 5000);
                        } else {
                            server.showMessage("发送失败", false);
                        }
                    } catch {
                        server.showMessage("请求超时", false);
                    }

                    // 按钮冷却时间0.5秒
                    setTimeout(() => {
                        btn.classList.remove("disabled");
                    }, 500);
                } catch {
                    // 用户取消操作，不需要做任何处理
                }
            });
        }

        // 设置按钮
        setupButton(
            "wakeBtn",
            "/cgi-bin/pve_wake.sh",
            "确认开机",
            "确定要唤醒 PVE 主机？",
            "开机指令已发送",
        );

        setupButton(
            "shutdownBtn",
            "/cgi-bin/multi_shutdown.sh",
            "确认关机",
            "确定要远程关机？",
            "关机指令已发送",
        );

        // 设置切换按钮
        setupButton(
            "switchWinBtn",
            "/cgi-bin/switch.sh",
            "确认切换",
            "确定要切换服务器系统？",
            "切换指令已发送",
        );


        class WifiToggle {
            constructor(toggleId, switchId) {
                this.toggle = document.getElementById(toggleId);
                this.switchbtn = document.getElementById(switchId);
                this.checkInterval = 60000;
                this.init();
            }

            init() {
                this.fetchStatus();
                setInterval(() => this.fetchStatus(), this.checkInterval);
            }

            async fetchStatus() {
                try {
                    const response = await fetch("/cgi-bin/ctrl.sh?" + this.toggle.id);
                    if (response.ok) {
                        const text = await response.text();
                        if (text.includes("up")) {
                            this.toggle.checked = true;
                            setTimeout(() => {
                                this.toggle.disabled = false;
                                this.switchbtn.style.cursor = "pointer";
                            }, 800);
                        } else if (text.includes("down")) {
                            this.toggle.checked = false;
                            setTimeout(() => {
                                this.toggle.disabled = false;
                                this.switchbtn.style.cursor = "pointer";
                            }, 800);
                        }
                    }
                }
                catch {
                }
            }

            async switch(toggle, switchbtn) {

                // 禁用开关，防止重复点击
                toggle.disabled = true;
                switchbtn.style.cursor = "wait";

                // 发送请求
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    const response = await fetch("/cgi-bin/ctrl.sh?" + toggle.id + "0", { signal: controller.signal });
                    const text = await response.text();
                    clearTimeout(timeoutId);
                    return text.trim();
                } catch {
                    return "";
                }
            }

        }
        const wifiToggle1 = new WifiToggle("toggle1", "Switch1");
        const wifiToggle2 = new WifiToggle("toggle2", "Switch2");
        let wifiBusy = false; // 防止同时操作两个开关


        wifiToggle1.toggle.addEventListener('change', async function () {
            if (wifiBusy) return; // 如果正在处理另一个开关，直接返回
            wifiBusy = true; // 标记为忙碌状态

            try {

                const ok = await handleToggle(wifiToggle1.toggle, wifiToggle2.toggle);
                if (!ok) {
                    wifiToggle1.fetchStatus();   // 取消 → 用真实状态还原 UI
                    return;
                }
                const result = await wifiToggle1.switch(wifiToggle1.toggle, wifiToggle1.switchbtn);
                if (result === "OKK") {
                    wifiToggle1.fetchStatus();   // 收到 OKK 才刷新
                }

            } finally {
                wifiBusy = false; // 无论成功或失败，都重置忙碌状态
            }

        });
        wifiToggle2.toggle.addEventListener('change', async function () {
            if (wifiBusy) return; // 如果正在处理另一个开关，直接返回
            wifiBusy = true; // 标记为忙碌状态

            try {
                const ok = await handleToggle(wifiToggle2.toggle, wifiToggle1.toggle);
                if (!ok) {
                    wifiToggle2.fetchStatus();   // 取消 → 用真实状态还原 UI
                    return;
                }
                const result = await wifiToggle2.switch(wifiToggle2.toggle, wifiToggle2.switchbtn);
                if (result === "OKK") {
                    wifiToggle2.fetchStatus();   // 收到 OKK 才刷新
                }

            } finally {
                wifiBusy = false; // 无论成功或失败，都重置忙碌状态
            }
        });

        async function handleToggle(currentToggle, otherToggle) {
            // 如果要关闭当前开关，且另一个开关已经关闭
            if (!currentToggle.checked && !otherToggle.checked) {
                // 弹出确认对话框
                try {
                    const userConfirmed = await modal.show("确认完全关闭无线？", "将使你完全失去无线连接，确定继续？");
                } catch {
                    return false; // 用户取消，恢复当前开关
                }
                return true; // 其他情况，允许切换
            }
            return true; // 其他情况，允许切换
        }

        class FirewallControl {
            constructor() {
                this.defaultSettingId = document.getElementById("0001"); // 默认设置ID
                this.allaccessSettingId = document.getElementById("0002"); // 全开放设置ID
                this.allblockSettingId = document.getElementById("0003"); // 全阻挡设置ID
                this.init();
            }

            init() {
                this.getCheckedFirewallSetting();
                setInterval(() => this.getCheckedFirewallSetting(), 60000);
            }

            async getCheckedFirewallSetting(settingId) {
                this.defaultSettingId.disabled = true;
                this.allaccessSettingId.disabled = true;
                this.allblockSettingId.disabled = true;
                try {
                    if (!settingId) {
                        settingId = "";
                    }
                    const response = await fetch(`/cgi-bin/modify_firewall.sh?${settingId}`);
                    const text = await response.text();
                    if (text.includes("OKK")) {
                    } else if (text.trim() === "0001") {
                        this.defaultSettingId.checked = true;
                    } else if (text.trim() === "0002") {
                        this.allaccessSettingId.checked = true;
                    } else if (text.trim() === "0003") {
                        this.allblockSettingId.checked = true;
                    } else {
                        document.getElementById("other").checked = true;
                    }
                    if (document.getElementById("fireDecide").checked) {
                        this.defaultSettingId.disabled = false;
                        this.allaccessSettingId.disabled = false;
                        this.allblockSettingId.disabled = false;
                    }
                } catch {
                }
            }
        }

        const firewallControl = new FirewallControl();

        document.getElementById("fireDecide").addEventListener("change", function () {
            setTimeout(() => {
                if (this.checked) {
                    firewallControl.defaultSettingId.disabled = false;
                    firewallControl.allaccessSettingId.disabled = false;
                    firewallControl.allblockSettingId.disabled = false;
                } else {
                    firewallControl.defaultSettingId.disabled = true;
                    firewallControl.allaccessSettingId.disabled = true;
                    firewallControl.allblockSettingId.disabled = true;
                }
            }, 250)

        });

        document.querySelectorAll('input[name="firewall"]').forEach((radio) => {
            radio.addEventListener('change', function () {
                const id = document.querySelector('input[name="firewall"]:checked')?.id;
                if (id && id !== 'other') firewallControl.getCheckedFirewallSetting(id);
            });
        });

        class SerStatus {
            constructor() {
                // 六个服务的元素 id（与后端 serstatus.sh 输出的服务名一致）
                this.ids = [
                    "lucky",
                    "aria2",
                    "cloudflared",
                    "openlist2",
                    "passwall",
                    "proxyover",
                ];
                this.checkInterval = 60000;
                this.init();
            }

            init() {
                this.getSerStatus();
                setInterval(() => this.getSerStatus(), this.checkInterval);
            }

            // 一次请求，遍历六个服务更新状态
            async getSerStatus() {
                try {
                    const response = await fetch(
                        "/cgi-bin/ser_status.sh?" + Date.now(),
                    );
                    const text = await response.text();

                    this.ids.forEach((id) => {
                        const el = document.getElementById(id);
                        // 重置旧状态，避免 status-checking 覆盖颜色
                        el.className = "status-dot";
                        el.classList.add(
                            text.includes(id) ? "status-online" : "status-offline",

                        );
                    });
                } catch {
                    // 请求失败，全部显示离线
                    this.ids.forEach((id) => {
                        const el = document.getElementById(id);
                        el.className =  "status-dot status-offline";
                    });
                }
            }
        }
        const serStatus = new SerStatus();

        // 硬件状态（CPU / 内存 / 磁盘 / 网络），对应 wrt_status.sh 返回的 JSON
        class HardStatus {
            constructor() {
                // JSON data 字段 → 页面元素 id 一一对应
                this.map = {
                    cpu: "cpuText",
                    mem: "memText",
                    disk: "diskText",
                    net: "netText",
                };
                this.checkInterval = 60000;
                this.init();
            }

            init() {
                this.fetchStatus();
                setInterval(() => this.fetchStatus(), this.checkInterval);
            }

            async fetchStatus() {
                try {
                    const response = await fetch(
                        "/cgi-bin/wrt_status.sh?" + Date.now(),
                    );
                    const json = await response.json();
                    if (json.code !== 0 || !json.data) return;

                    const data = json.data;
                    Object.keys(this.map).forEach((key) => {
                        if (data[key] !== undefined) {
                            document.getElementById(this.map[key]).textContent =
                                data[key];
                        }
                    });
                } catch {
                    // 请求失败，保持上次显示
                }
            }
        }
        const hardStatus = new HardStatus();

    </script>
